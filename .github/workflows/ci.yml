name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, codegen & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Pinned exactly, as pug's buf-ci pins it. The token authenticates the buf download from
      # GitHub releases, which unauthenticated runners share a rate limit for.
      - uses: bufbuild/buf-action@v1.7.0
        with:
          setup_only: true
          version: 1.73.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Built with the job's Go rather than downloaded: a release binary built with an older Go
      # can't load a newer standard library.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - run: go mod tidy -diff

      - run: make ci

      - name: Check for uncommitted changes
        run: git diff --exit-code

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: make test
